<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'">
  <title>Limen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="fakenotch" class="off" aria-hidden="true"></div>

    <!-- Each chip carries one unit per limit, built in the renderer: a chip
         holds one number most of the time and two when three limits are
         asked for, and a fixed set of spans cannot say both. -->
    <div id="wings" class="off">
      <div class="wing left"></div>
      <div class="wing right"></div>
    </div>

    <div id="peek" class="off">
      <span class="ring big"></span>
      <div class="peek-text">
        <div class="peek-title"></div>
        <div class="peek-sub"></div>
      </div>
    </div>

    <div id="panel" class="off">
      <div class="head">
        <span class="star">&#10033;</span>
        <span class="title">Claude</span>
        <span class="when"></span>
        <button class="iconbtn" id="refresh-btn" title="Refresh now">&#8635;</button>
      </div>
      <div id="stale" class="off"><span class="dot"></span><span class="stale-text"></span></div>
      <div id="rows"></div>
      <div id="ceiling" class="off"></div>
      <div id="prime" class="off"></div>
      <div id="primebar" class="off">
        <!-- Two rows, not one: which limits appear and what each one adds are
             different questions, and a single "Chips" label answered neither. -->
        <div class="prow wingrow" id="wsrcrow">
          <span class="lbl">Show</span>
          <span class="chips wsrc"></span>
        </div>
        <div class="prow wingrow" id="winforow">
          <span class="lbl">Detail</span>
          <span class="chips winfo"></span>
        </div>
        <div class="prow">
          <span class="lbl">Auto-open</span>
          <span class="chips mode"></span>
        </div>
        <div class="prow detail">
          <span class="lbl">Time</span>
          <span class="stepper">
            <button class="step" data-field="h" data-delta="-1" aria-label="Hour earlier">&minus;</button>
            <span class="clock"></span>
            <button class="step" data-field="h" data-delta="1" aria-label="Hour later">+</button>
            <span class="sep">min</span>
            <button class="step" data-field="m" data-delta="-1" aria-label="15 minutes earlier">&minus;</button>
            <button class="step" data-field="m" data-delta="1" aria-label="15 minutes later">+</button>
          </span>
        </div>
        <div class="prow detail">
          <span class="lbl">Days</span>
          <span class="chips days"></span>
        </div>
      </div>
    </div>
  </div>
  <script src="../viewmodel.js"></script>
  <script src="island.js"></script>
</body>
</html>
